# PumpkinMC Server Configuration with RCON
# Generated for pumpkin-unified-core plugin

# Network
server-port=25491
server-ip=0.0.0.0

# RCON Configuration
enable-rcon=true
rcon.port=25575
rcon.password=changeme_secure_password

# Query Protocol
enable-query=true
query.port=25585

# Level
level-name=world
level-seed=
level-type=DEFAULT
generator-settings=

# Gameplay
gamemode=survival
force-gamemode=false
hardcore=false
difficulty=easy
spawn-monsters=true
spawn-animals=true
spawn-npcs=true
pvp=true
max-players=20
player-idle-timeout=300

# World Settings
view-distance=10
simulation-distance=10
spawn-protection=16
max-tick-time=60000

# RCON Access (for automated testing/verification)
# Connect with: rcon-cli --host <host> --port 25575 --password changeme_secure_password