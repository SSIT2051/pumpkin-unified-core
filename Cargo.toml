[package]
name = "pumpkin-unified-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["SSIT2051"]
description = "Unified EssentialsX + LuckPerms plugin for PumpkinMC (WASM component)"

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = "0.2.1"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = { version = "0.14", features = ["toml", "yaml"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true